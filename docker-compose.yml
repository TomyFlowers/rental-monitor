services:
  rental-monitor:
    build: .
    container_name: rental-monitor
    restart: unless-stopped
    env_file: .env
    # Set PUID/PGID in .env if the NAS folders below belong to another user.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./config:/app/config:ro   # edit config.yaml here, then restart
      - ./data:/app/data          # SQLite database
      - ./logs:/app/logs          # daily-rotated log files
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
